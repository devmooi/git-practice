<script>
    // 뒤로가기
    document.querySelector('.rp-back').addEventListener('click', () => history.back());

    // 하단 탭: 홈 / 냉장고 → 냉장고 화면(index.html)
    document.querySelectorAll('.nav-btn').forEach((btn) => {
        const name = btn.getAttribute('aria-label');
        if (name === '홈' || name === '냉장고') {
            btn.addEventListener('click', () => { location.href = 'index.html'; });
        }
    });

    // 화면이 420 보다 좁으면 전체를 같은 비율로 줄이기
    const wrap = document.querySelector('.recipe-page-wrap');
    const sizer = wrap.firstElementChild;
    const page = document.querySelector('.recipe-page');
    const fit = () => {
        const s = Math.min(1, wrap.clientWidth / 420);
        page.style.transform = 'scale(' + s + ')';
        sizer.style.height = (852 * s) + 'px';
    };
    new ResizeObserver(fit).observe(wrap);
    fit();
</script>
