<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레시피를 찾아보세요</title>
    <link rel="icon" type="image/png" href="../fridge/public/logo.png">
    <!-- 냉장고 스타일: ../fridge 프로젝트의 CSS를 그대로 사용 -->
    <link rel="stylesheet" href="../fridge/src/styles/fridge.css">
    <style>
        :root {
            --primary-color: #4CAF50;
            --bg-color: #F2F2F2;
            --text-color: #333;
            /* 앱 화면 크기 */
            --app-w: 420px;
            --app-h: 912px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
        }

        /* 앱 화면: 420 x 912 (화면이 더 작으면 화면에 꽉 차게)
           내용(.container)은 스크롤, 하단 탭은 맨 아래에 고정 */
        .app {
            display: flex;
            flex-direction: column;
            width: min(var(--app-w), 100vw);
            height: min(var(--app-h), 100dvh);
            margin: 0 auto;
            background: var(--bg-color);
            overflow: hidden;
        }

        /* 넓은 화면에서는 앱 화면의 테두리가 보이게 */
        @media (min-width: 440px) {
            .app {
                box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 8px 30px rgba(0, 0, 0, 0.06);
            }
        }

        .container {
            flex: 1;
            min-height: 0;
            padding: 24px 20px;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* ---- 하단 탭 ---- */
        .bottom-nav {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px; /* 하단 바 높이 */
            padding-bottom: env(safe-area-inset-bottom);
            background: #fff;
            border-top: 1px solid #ccc;
        }

        /* 아이콘 줄: 360 x 40, 아이콘 사이 65px (좁은 화면에서는 양옆 여백만큼 줄어듦) */
        .nav-icons {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 65px;
            width: min(360px, 100% - 32px);
            height: 40px;
            padding: 0;
        }

        .nav-btn {
            flex: 1;
            display: grid;
            place-items: center;
            height: 40px;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
        }

        .nav-btn svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: #8aab6b;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s;
        }

        .nav-btn:hover svg {
            transform: translateY(-2px);
        }

        /* 상단: 뒤로가기 + 로고 + 제목 */
        .page-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: -10px 0 24px -10px;
        }

        .back-btn {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: none;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(79, 138, 43, 0.08);
        }

        .back-btn svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: #8ab56a;
            stroke-width: 2.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .page-logo {
            width: 52px;
            height: auto;
        }

        .page-header h1 {
            margin: 0 0 0 10px;
            font-size: clamp(20px, 5.5vw, 26px);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #111;
        }

        /* 둥근 검색창 (돋보기 + 입력칸) */
        .search-box {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 52px;
            padding: 0 22px;
            margin-bottom: 20px;
            border: 2px solid #7aa75a;
            border-radius: 999px;
            background: #fff;
            cursor: text;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-box:focus-within {
            border-color: #4f8a2b;
            box-shadow: 0 0 0 3px rgba(79, 138, 43, 0.15);
        }

        .search-box svg {
            flex: none;
            width: 26px;
            height: 26px;
            fill: none;
            stroke: #8ab56a;
            stroke-width: 2.4;
            stroke-linecap: round;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: none;
            font: inherit;
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .search-box input::placeholder {
            color: #b0b0b0;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            min-height: 40px;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }

        .tag {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag .remove-btn {
            cursor: pointer;
            font-weight: bold;
            color: #c62828;
        }

        .recipe-list {
            margin-top: 20px;
        }

        .recipe-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            animation: fadeIn 0.5s ease;
        }

        .recipe-title {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .recipe-match {
            font-size: 12px;
            color: #757575;
            margin-bottom: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 냉장고: 앱 너비에 맞게 크기를 맞추고, 닫혀 있을 때 가운데에 오게 함
           (fridge 앱의 app.css 와 같은 값) */
        .fridge-box {
            container-type: inline-size;
            margin: 10px 0 20px;
        }

        .fridge-box .fridge-wrap {
            --u: calc(100cqw / 600);
            width: 100%;
            height: calc(560 * var(--u));
            margin: 0;
        }

        .fridge-box .zone {
            left: 0;
            width: 100%;
        }

        .fridge-box .zone-door {
            height: calc(285 * var(--u));
        }

        .fridge-box .zone-freezer {
            top: calc(285 * var(--u));
            height: calc(275 * var(--u));
        }

        .fridge-box .cabinet {
            margin: calc(30 * var(--u)) 0 0 calc(184 * var(--u));
            transition: transform 0.8s cubic-bezier(0.3, 0.9, 0.3, 1);
        }

        /* 문이 열리면 냉장고를 왼쪽으로 살짝 밀어서 열린 문까지 화면 안에 들어오게 */
        .fridge-box .zone-door:hover ~ .scene .cabinet,
        .fridge-box .zone-door:focus ~ .scene .cabinet,
        .fridge-box .zone-freezer:hover ~ .scene .cabinet,
        .fridge-box .zone-freezer:focus ~ .scene .cabinet {
            transform: translateX(calc(-107 * var(--u))) rotateX(-12deg) rotateY(24deg);
        }
    </style>
</head>

<script>
    // 가상의 샘플 레시피 데이터베이스 (확장 가능)
    const recipeDatabase = [
        { title: "김치볶음밥", ingredients: ["김치", "밥", "스팸", "계란"], recipe: "1. 팬에 기름을 두르고 다진 김치와 스팸을 볶습니다. 2. 밥을 넣고 함께 볶은 뒤 참기름을 두릅니다. 3. 계란 후라이를 올려 마무리합니다." },
        { title: "계란말이", ingredients: ["계란", "대파"], recipe: "1. 계란을 풀고 소금으로 간을 합니다. 2. 다진 대파를 섞어줍니다. 3. 달군 팬에 계란물을 나누어 부어가며 돌돌 말아줍니다." },
        { title: "스팸두부조림", ingredients: ["스팸", "두부", "대파"], recipe: "1. 두부와 스팸을 도톰하게 썰어 냄비에 번갈아 깝니다. 2. 간장, 고춧가루, 다진 마늘로 양념장을 만들어 부어줍니다. 3. 대파를 올리고 자작하게 조립니다." },
        { title: "된장찌개", ingredients: ["두부", "대파", "호박", "감자"], recipe: "1. 뚝배기에 물을 붓고 된장을 풉니다. 2. 감자, 호박을 먼저 넣어 끓입니다. 3. 두부와 대파를 넣고 한소끔 더 끓여 완성합니다." }
    ];

    let currentIngredients = [];

    const input = document.getElementById('ingredient-input');
    const tagsContainer = document.getElementById('tags-container');
    const recipeList = document.getElementById('recipe-list');

    // 재료 추가 기능
    function addIngredients() {
        const value = input.value.trim();
        if (!value) return;

        // 쉼표로 입력해도 분리되도록 설정
        const items = value.split(',').map(item => item.trim()).filter(item => item !== "");
        
        items.forEach(item => {
            if (!currentIngredients.includes(item)) {
                currentIngredients.push(item);
                renderTags();
            }
        });
        input.value = "";
    }

    // 태그 화면에 그리기
    function renderTags() {
        tagsContainer.innerHTML = "";
        currentIngredients.forEach((ingredient, index) => {
            const tag = document.createElement('div');
            tag.className = 'tag';
            tag.innerHTML = `${ingredient} <span class="remove-btn" onclick="removeIngredient(${index})">&times;</span>`;
            tagsContainer.appendChild(tag);
        });
        // 재료가 바뀔 때마다 레시피를 다시 찾기
        searchRecipes();
    }

    // 태그 삭제
    window.removeIngredient = function(index) {
        currentIngredients.splice(index, 1);
        renderTags();
    };

    // 레시피 검색 알고리즘
    function searchRecipes() {
        recipeList.innerHTML = "";
        // 재료가 없으면 결과도 비워둠
        if (currentIngredients.length === 0) return;

        // 레시피 이름이 맞거나 재료가 겹치는 레시피 찾기
        // (이름이 맞는 레시피 먼저, 그다음 재료가 많이 겹치는 순서)
        const results = recipeDatabase
            .map(recipe => {
                const matched = recipe.ingredients.filter(ing => currentIngredients.includes(ing));
                const titleMatch = currentIngredients.some(word => recipe.title.includes(word));
                return { ...recipe, matchCount: matched.length, matchedIngredients: matched, titleMatch };
            })
            .filter(recipe => recipe.matchCount > 0 || recipe.titleMatch)
            .sort((a, b) => (b.titleMatch - a.titleMatch) || (b.matchCount - a.matchCount));

        if (results.length === 0) {
            recipeList.innerHTML = "<p style='text-align:center; color:#999;'>일치하는 레시피가 없습니다. 다른 레시피나 재료를 입력해보세요!</p>";
            return;
        }

        // 결과 화면 표시
        results.forEach(recipe => {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            card.innerHTML = `
                <div class="recipe-title">🍳 ${recipe.title}</div>
                <div class="recipe-match">${recipe.matchCount > 0
                    ? `보유 재료 매칭: ${recipe.matchedIngredients.join(', ')} (${recipe.matchCount}/${recipe.ingredients.length})`
                    : `재료: ${recipe.ingredients.join(', ')}`}</div>
                <p style="margin: 0; line-height: 1.6; font-size:14px; color:#555;">${recipe.recipe}</p>
            `;
            recipeList.appendChild(card);
        });
    }

    // 이벤트 리스너 연결
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') addIngredients(); });
</script>

</body>
</html>
